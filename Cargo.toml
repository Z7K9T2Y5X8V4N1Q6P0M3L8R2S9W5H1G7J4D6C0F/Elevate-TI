[package]
name = "elevate-ti"
version = "0.1.0"
edition = "2024"
description = "A safe, idiomatic Rust library to obtain Windows TrustedInstaller privileges and relaunch processes"
repository = "https://github.com/Z7K9T2Y5X8V4N1Q6P0M3L8R2S9W5H1G7J4D6C0F/Elevate-TI"
license = "MIT"

[workspace.lints.rust]
missing_docs = "deny"

[dependencies]
sysinfo = "0.39"
thiserror = "2.0.20"

[dependencies.windows]
version = "0.58"
features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Environment", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"]

[lints.clippy]
all = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
nursery = { level = "deny", priority = -1 }
panic = "deny"
pedantic = { level = "deny", priority = -1 }
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[lints.rust]
missing_docs = "deny"
warnings = "deny"
